plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv('SENTINELX_ANDROID_KEYSTORE')

def releaseStorePassword = System.getenv('SENTINELX_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('SENTINELX_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SENTINELX_ANDROID_KEY_PASSWORD')
def desktopProject = rootProject.file('../SENTINEL-X.csproj')
def desktopVersionMatch = (desktopProject.getText('UTF-8') =~ /<Version>([^<]+)<\/Version>/)
if (!desktopVersionMatch.find()) throw new GradleException("Could not read <Version> from ${desktopProject}")
def desktopVersionName = desktopVersionMatch.group(1)

android {
    namespace 'pl.sentinelx.phone'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.sentinelx.phone'
        minSdk 24
        targetSdk 35
        // Keep this Android-specific integer strictly increasing; 100 follows the published versionCode 98.
        versionCode 100
        versionName desktopVersionName
    }

    // Release signing is injected by CI from protected environment variables.
    // Local builds without signing inputs remain unsigned; no key or password is stored in source.
    if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
        signingConfigs {
            release {
                storeFile file(releaseStorePath)
                storeType 'pkcs12'
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword)
                signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
