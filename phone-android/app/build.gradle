plugins { id 'com.android.application' }
android {
    namespace 'pl.sentinelx.phone'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'pl.sentinelx.phone'
        minSdk 24
        targetSdk 35
        versionCode 100
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            def path = System.getenv('SX_ANDROID_KEYSTORE')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('SX_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('SX_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('SX_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('SX_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
