name: Android phone app (build check)

# Sprawdza, że aplikacja na telefon się buduje. Gotowy plik APK trafia do wydania razem z EXE (workflow „Release”).
# Uruchamia się tylko, gdy zmienia się kod aplikacji na Androida — działa na Linuksie (najtańsze minuty).
on:
  push:
    branches: [main, 'arena/**']
    paths: ['phone-android/**', '.github/actions/build-apk/**', '.github/workflows/android-phone.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/build-apk
      - name: Summary
        shell: bash
        run: |
          sha=$(sha256sum "${{ steps.build.outputs.apk }}" | cut -d' ' -f1)
          echo "::notice title=APK zbudowany::${{ steps.build.outputs.apk }} · sha256 $sha"
