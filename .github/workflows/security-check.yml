name: Security and SX4 integration
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 scripts/security-check.py
      - run: dotnet run --project verification/Build1/Build1.csproj -c Release
      - run: python3 scripts/test-sx4-tls.py
