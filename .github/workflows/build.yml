name: SentinelX Build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WPF application
    runs-on: windows-latest

steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore SENTINEL-X.csproj

      - name: Build Release
        run: dotnet build SENTINEL-X.csproj --configuration Release --no-restore --verbosity normal

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinelx-build-output
          path: |
            **/bin/Release/**
            **/obj/Release/**
          if-no-files-found: ignore
