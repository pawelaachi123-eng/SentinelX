name: Apply Build 1.0 maintenance checkpoint
on:
  push:
    branches: [arena/build-1.0-resume]
    paths: [build3.patch, .github/workflows/apply-build3.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/arena/build-1.0-resume'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/build-1.0-resume
      - name: Verify and apply reviewed checkpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "fc192914777c18d18ef79ff63d03f1bf31bc75ea94205f7b6534d3e80bcad8eb  build3.patch" | sha256sum -c -
          git apply --check build3.patch
          git apply build3.patch
          git rm build3.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply tested lifecycle, cipher and repair rollback"
          git push origin HEAD:arena/build-1.0-resume
