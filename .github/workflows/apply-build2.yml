name: Apply Build 1.0 maintenance checkpoint
on:
  push:
    branches: [arena/build-1.0-resume]
    paths: [build2.patch, .github/workflows/apply-build2.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/arena/build-1.0-resume'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/build-1.0-resume
      - name: Verify and apply reviewed checkpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "ea3774aa0161f20f8bbc65f5a53fcacbea70dbfce6323aa5a4650b25acb9496c  build2.patch" | sha256sum -c -
          git apply --check build2.patch
          git apply build2.patch
          git rm build2.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply tested updater, diagnostics and TLS integration"
          git push origin HEAD:arena/build-1.0-resume
