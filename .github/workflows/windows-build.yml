name: Windows build and WPF smoke
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Portable architecture checks
        run: python scripts/check-architecture.py
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore SENTINEL-X.csproj 2>&1 | Tee-Object restore.log
          if ($LASTEXITCODE -ne 0) {
            $detail = (Get-Content restore.log -Raw).Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::$detail"
            exit 1
          }
      - name: Build
        run: dotnet build SENTINEL-X.csproj -c Release --no-restore
      - name: MVVM UI smoke (all pages and binding validation)
        shell: pwsh
        run: |
          $exe = Resolve-Path 'bin/Release/net9.0-windows/SentinelX.exe'
          $output = Join-Path $PWD 'test-results/ui'
          $p = Start-Process $exe -ArgumentList '--ui-smoke', $output -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'UI smoke timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$output/ui-smoke.txt")) {
            Get-ChildItem $output -Recurse -Include FAILED.txt,errors.log,bindings.log | ForEach-Object {
              $detail = (Get-Content $_.FullName -Raw).Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error::$detail"
            }
            throw "UI smoke failed: exit $($p.ExitCode)"
          }
          Get-Content "$output/ui-smoke.txt"
      - name: Existing regression suite
        shell: pwsh
        run: |
          $exe = Resolve-Path 'bin/Release/net9.0-windows/SentinelX.exe'
          $output = Join-Path $PWD 'test-results/regression'
          $p = Start-Process $exe -ArgumentList '--self-test', $output -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'Regression timeout' }
          if ($p.ExitCode -ne 0) {
            Get-ChildItem $output -Recurse -Include FAILED.txt,errors.log | ForEach-Object {
              $detail = (Get-Content $_.FullName -Raw).Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error::$detail"
            }
            throw "Regression failed: exit $($p.ExitCode)"
          }
          Get-ChildItem $output
      - name: Publish portable Windows application
        run: dotnet publish SENTINEL-X.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o bin/portable
      - name: Portable package checksums
        shell: pwsh
        run: |
          Get-ChildItem 'bin/portable' -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content 'bin/portable/SHA256SUMS.txt'
      - name: Verify portable package
        shell: pwsh
        run: |
          if (-not (Test-Path 'bin/portable/coreclr.dll')) { throw 'Missing self-contained .NET runtime' }
          $exe = Resolve-Path 'bin/portable/SentinelX.exe'
          $output = Join-Path $PWD 'test-results/portable'
          $p = Start-Process $exe -ArgumentList '--ui-smoke', $output -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Portable smoke timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$output/ui-smoke.txt")) {
            Get-ChildItem $output -Recurse -Include FAILED.txt,errors.log,bindings.log | ForEach-Object {
              $detail = (Get-Content $_.FullName -Raw).Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error::$detail"
            }
            throw "Portable smoke failed: exit $($p.ExitCode)"
          }
      - name: Build per-user EXE installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler missing from Windows runner image' }
          [xml]$project = Get-Content SENTINEL-X.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          & $compiler "/DAppVersion=$version" 'installer/SentinelX.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installer = Get-ChildItem 'bin/installer/*.exe' | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content 'bin/installer/SHA256SUMS.txt'
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Output "::notice title=SHA256 instalatora::$hash  $($installer.Name)"
          $exeHash = (Get-FileHash 'bin/portable/SentinelX.exe' -Algorithm SHA256).Hash
          "PORTABLE_EXE_SHA256=$exeHash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Output "::notice title=SHA256 portable::bin/portable/z SHA256SUMS.txt · $exeHash  SentinelX.exe"
      - name: Install EXE and smoke-test installed application
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'bin/installer/*.exe' | Select-Object -First 1
          $installed = Join-Path $env:RUNNER_TEMP 'SentinelX-installed'
          $output = Join-Path $PWD 'test-results/installer'
          New-Item -ItemType Directory -Force $output | Out-Null
          $setup = Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installed`"", "/LOG=`"$output/setup.log`"" -PassThru
          if (-not $setup.WaitForExit(120000)) { $setup.Kill(); throw 'Installer timeout' }
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          if (-not (Test-Path "$installed/coreclr.dll")) { throw 'Installed runtime missing' }
          $p = Start-Process "$installed/SentinelX.exe" -ArgumentList '--ui-smoke', $output -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Installed application timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$output/ui-smoke.txt")) {
            Get-ChildItem $output -Recurse -Include FAILED.txt,errors.log,bindings.log | ForEach-Object {
              $detail = (Get-Content $_.FullName -Raw).Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error::$detail"
            }
            throw "Installed application smoke failed: $($p.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-validation
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelX-windows-x64
          path: bin/Release/net9.0-windows/

      - uses: actions/upload-artifact@v4
        with:
          name: SentinelX-Portable-win-x64
          path: bin/portable/

      - uses: actions/upload-artifact@v4
        with:
          name: SentinelX-Setup-win-x64
          path: bin/installer/
