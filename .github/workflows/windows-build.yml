name: Windows build and WPF smoke

# Sprawdza dokładnie to, co trafia do użytkownika: samodzielną paczkę (z wbudowanym .NET i silnikiem AI) oraz instalator.
# Jeden przebieg na push (bez dublowania przez pull_request); gotowy instalator EXE jest też publikowany jako krótko żyjący artefakt CI.
# APK buduje android-phone.yml niezależnie, dzięki czemu oba pliki są dostępne po zwykłym pushu bez tworzenia wydania.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Portable architecture checks
        run: python scripts/check-architecture.py
      - name: Release version consistency
        run: python scripts/check-versions.py
      - name: Portable syntax sanity check (brackets, strings, duplicate types - not a compiler)
        run: python scripts/check-syntax-lite.py
      - name: Bundled AI engine (llama.cpp - pinned, SHA-256 verified, started with --version)
        shell: pwsh
        run: ./scripts/fetch-llama.ps1
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore SENTINEL-X.csproj -r win-x64 2>&1 | Tee-Object restore.log
          if ($LASTEXITCODE -ne 0) {
            $detail = (Get-Content restore.log -Raw).Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::$detail"
            exit 1
          }
      - name: Publish self-contained win-x64 (this is also the compile check)
        shell: pwsh
        run: |
          dotnet publish SENTINEL-X.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false --no-restore -o bin/portable 2>&1 | Tee-Object publish.log
          if ($LASTEXITCODE -ne 0) {
            $errors = Get-Content publish.log | Where-Object { $_ -match ' error ' } | Select-Object -Unique -First 40
            $detail = ($errors -join "`n").Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error title=Kompilacja nie powiodła się::$detail"
            exit 1
          }
          if (-not (Test-Path 'bin/portable/coreclr.dll')) { throw 'Missing self-contained .NET runtime' }
          if (-not (Get-ChildItem 'bin/portable/Engine' -Recurse -Filter 'llama-server.exe' -ErrorAction SilentlyContinue)) { throw 'The AI engine was not bundled into the package' }
      - name: MVVM UI smoke + engine and phone-link regression (on the self-contained build)
        shell: pwsh
        run: |
          $exe = Resolve-Path 'bin/portable/SentinelX.exe'
          $output = Join-Path $PWD 'test-results/ui'
          $p = Start-Process $exe -ArgumentList '--ui-smoke', $output -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw 'UI smoke timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$output/ui-smoke.txt")) {
            Get-ChildItem $output -Recurse -Include FAILED.txt,errors.log,bindings.log | ForEach-Object {
              $detail = (Get-Content $_.FullName -Raw).Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error::$detail"
            }
            throw "UI smoke failed: exit $($p.ExitCode)"
          }
          Get-Content "$output/ui-smoke.txt"
      - name: Existing regression suite
        shell: pwsh
        run: |
          $exe = Resolve-Path 'bin/portable/SentinelX.exe'
          $output = Join-Path $PWD 'test-results/regression'
          $p = Start-Process $exe -ArgumentList '--self-test', $output -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'Regression timeout' }
          if ($p.ExitCode -ne 0) {
            Get-ChildItem $output -Recurse -Include FAILED.txt,errors.log | ForEach-Object {
              $detail = (Get-Content $_.FullName -Raw).Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error::$detail"
            }
            throw "Regression failed: exit $($p.ExitCode)"
          }
          Get-ChildItem $output
      - name: Portable package checksums
        shell: pwsh
        run: |
          Get-ChildItem 'bin/portable' -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content 'bin/portable/SHA256SUMS.txt'
      - name: Build per-user EXE installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler missing from Windows runner image' }
          [xml]$project = Get-Content SENTINEL-X.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          & $compiler "/DAppVersion=$version" 'installer/SentinelX.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installer = Get-ChildItem 'bin/installer/*.exe' | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content 'bin/installer/SHA256SUMS.txt'
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Output "::notice title=SHA256 instalatora::$hash  $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
      - name: Install EXE and smoke-test the installed application
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'bin/installer/*.exe' | Select-Object -First 1
          $installed = Join-Path $env:RUNNER_TEMP 'SentinelX-installed'
          $output = Join-Path $PWD 'test-results/installer'
          New-Item -ItemType Directory -Force $output | Out-Null
          $setup = Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installed`"", "/LOG=`"$output/setup.log`"" -PassThru
          if (-not $setup.WaitForExit(180000)) { $setup.Kill(); throw 'Installer timeout' }
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          if (-not (Test-Path "$installed/coreclr.dll")) { throw 'Installed runtime missing' }
          if (-not (Get-ChildItem "$installed/Engine" -Recurse -Filter 'llama-server.exe' -ErrorAction SilentlyContinue)) { throw 'Installed AI engine missing' }
          $p = Start-Process "$installed/SentinelX.exe" -ArgumentList '--ui-smoke', $output -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw 'Installed application timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$output/ui-smoke.txt")) {
            Get-ChildItem $output -Recurse -Include FAILED.txt,errors.log,bindings.log | ForEach-Object {
              $detail = (Get-Content $_.FullName -Raw).Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error::$detail"
            }
            throw "Installed application smoke failed: $($p.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sentinelx-windows-x64-installer-${{ github.sha }}
          path: |
            bin/installer/*.exe
            bin/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # limit magazynu artefaktów nie może zamieniać wyników testów na czerwone
        if: always()
        with:
          name: sentinel-validation
          path: test-results/
          retention-days: 2
