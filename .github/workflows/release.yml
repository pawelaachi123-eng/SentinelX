name: Release gated EXE and APK
on:
  push:
    tags: ['v1.0.0']
  workflow_dispatch:
    inputs:
      production:
        description: 'Production APK with external signing secrets'
        type: boolean
        default: false
      hardware_verified:
        description: 'Real ESP32, Windows login/tray and Android hardware tests completed'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    uses: ./.github/workflows/security-check.yml
  windows:
    uses: ./.github/workflows/ci-windows.yml
  android:
    uses: ./.github/workflows/ci-android.yml
    with:
      production: ${{ startsWith(github.ref, 'refs/tags/') || inputs.production == true }}
    secrets: inherit
  publish:
    needs: [security, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-1.0.0
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: android-1.0.0
          path: dist/
      - name: Validate all assets together
        run: |
          set -euo pipefail
          python3 scripts/check-release-artifacts.py --windows dist/SentinelX-1.0.0-win-x64-setup.exe --portable dist/SentinelX-1.0.0-win-x64-portable.zip --android dist/SentinelX-1.0.0-android.apk
          cd dist
          sha256sum SentinelX-1.0.0-win-x64-setup.exe SentinelX-1.0.0-win-x64-portable.zip SentinelX-1.0.0-android.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish after all build gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION: ${{ startsWith(github.ref, 'refs/tags/') || inputs.production == true }}
          HARDWARE: ${{ inputs.hardware_verified }}
        run: |
          set -euo pipefail
          if [ "$PRODUCTION" = true ]; then
            test "$HARDWARE" = true || { echo "::error::Hardware verification required before a stable release"; exit 1; }
            tag=v1.0.0
            gh release create "$tag" --target "$GITHUB_SHA" --title "Sentinel X Build 1.0" --notes-file docs/RELEASE_NOTES.md dist/SentinelX* dist/SHA256SUMS.txt
            git tag -f latest "$GITHUB_SHA"
            git push origin refs/tags/latest --force
          else
            tag="v1.0.0-verification.${GITHUB_SHA:0:8}"
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false --title "Sentinel X 1.0.0 — verification/debug APK" --notes-file docs/RELEASE_NOTES.md dist/SentinelX* dist/SHA256SUMS.txt
          fi
