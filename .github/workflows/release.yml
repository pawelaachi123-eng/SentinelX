name: Release (EXE installer, portable ZIP, phone APK, checksums)

# Publikacja plików na GitHubie — TYLKO na żądanie (decyzja użytkownika 2026-09-25: wydanie „rolling” przy każdym pushu wyłączone).
#   - push tagu v*.*.*   → wydanie milowe (np. v0.94.0) z pełną walidacją.
#   - workflow_dispatch  → ręczne wydanie pod wskazanym tagiem (puste pole = v<wersja z SENTINEL-X.csproj>).
#   - push na gałąź arena/** z napisem [release] w komunikacie commita → wydanie przedpremierowe v<wersja>
#     (dla agentów i skryptów, które mogą pushować, ale nie mogą uruchamiać workflowów ręcznie).
#     Push bez tego napisu nie robi nic — zadania są pomijane i nie zużywają minut.
# Jedno wydanie zawiera komplet: instalator EXE, wersję przenośną ZIP, APK i sumy kontrolne.
# Windows i Android budują osobne artefakty; osobny job publikuje dopiero po sukcesie obu, bez nadpisywania istniejących wydań.
# Oficjalny APK wymaga nowego, trwałego klucza z chronionych sekretów — stary klucz z repozytorium nie jest już używany.
on:
  push:
    tags: ['v*.*.*']
    branches: ['arena/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag wydania (puste = v<wersja z SENTINEL-X.csproj>)'
        required: false
        default: ''
      prerelease:
        description: 'Wydanie przedpremierowe (nie zabiera etykiety „Latest” poprzedniej wersji)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signing-check:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SENTINELX_ANDROID_KEYSTORE_BASE64: ${{ secrets.SENTINELX_ANDROID_KEYSTORE_BASE64 }}
      SENTINELX_ANDROID_STORE_PASSWORD: ${{ secrets.SENTINELX_ANDROID_STORE_PASSWORD }}
      SENTINELX_ANDROID_KEY_PASSWORD: ${{ secrets.SENTINELX_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Require a protected, persistent Android signing key before a release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SENTINELX_ANDROID_KEYSTORE_BASE64" || -z "$SENTINELX_ANDROID_STORE_PASSWORD" || -z "$SENTINELX_ANDROID_KEY_PASSWORD" ]]; then
            echo '::error title=Brak bezpiecznego klucza APK::Wydanie wymaga nowych, trwałych sekretów Androida. Nie używaj starego klucza z repozytorium.'
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate keystore, alias and private-key password without printing credentials
        shell: bash
        env:
          SENTINELX_ANDROID_KEY_ALIAS: ${{ secrets.SENTINELX_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/sentinelx-release-check.p12"
          alias="${SENTINELX_ANDROID_KEY_ALIAS:-sentinelx}"
          printf '%s' "$SENTINELX_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
          if ! keytool -list -keystore "$ks" -storetype PKCS12 -storepass "$SENTINELX_ANDROID_STORE_PASSWORD" -alias "$alias" >/dev/null 2>&1; then
            echo '::error title=Podpis APK::Nieprawidłowy magazyn, hasło lub alias klucza Androida.'
            exit 1
          fi
          if ! keytool -certreq -keystore "$ks" -storetype PKCS12 -storepass "$SENTINELX_ANDROID_STORE_PASSWORD" \
              -keypass "$SENTINELX_ANDROID_KEY_PASSWORD" -alias "$alias" -file "$RUNNER_TEMP/sentinelx-release-check.csr" >/dev/null 2>&1; then
            echo '::error title=Podpis APK::Nieprawidłowe hasło klucza prywatnego Androida.'
            exit 1
          fi
          rm -f "$ks" "$RUNNER_TEMP/sentinelx-release-check.csr"
          echo '::notice title=Podpis APK::Nowy klucz trwały jest poprawny; poświadczenia nie zostały wypisane.'

  windows:
    needs: signing-check
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Portable architecture checks
        run: python scripts/check-architecture.py
      - name: Bundled AI engine (llama.cpp - pinned, SHA-256 verified, started with --version)
        shell: pwsh
        run: ./scripts/fetch-llama.ps1
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore SENTINEL-X.csproj -r win-x64 2>&1 | Tee-Object restore.log
          if ($LASTEXITCODE -ne 0) {
            $detail = (Get-Content restore.log -Raw).Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::$detail"
            exit 1
          }
      - name: Publish portable (self-contained win-x64) - also the compile check
        shell: pwsh
        run: |
          dotnet publish SENTINEL-X.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false --no-restore -o bin/portable 2>&1 | Tee-Object publish.log
          if ($LASTEXITCODE -ne 0) {
            $errors = Get-Content publish.log | Where-Object { $_ -match ' error ' } | Select-Object -Unique -First 40
            $detail = ($errors -join "`n").Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error title=Kompilacja nie powiodła się::$detail"
            exit 1
          }
          if (-not (Test-Path 'bin/portable/coreclr.dll')) { throw 'Missing self-contained .NET runtime' }
          if (-not (Get-ChildItem 'bin/portable/Engine' -Recurse -Filter 'llama-server.exe' -ErrorAction SilentlyContinue)) { throw 'The AI engine was not bundled into the package' }
      - name: MVVM UI smoke + engine and phone-link regression (on the exact files that ship)
        shell: pwsh
        run: |
          $exe = Resolve-Path 'bin/portable/SentinelX.exe'
          $output = Join-Path $PWD 'test-results/ui'
          $p = Start-Process $exe -ArgumentList '--ui-smoke', $output -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw 'UI smoke timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$output/ui-smoke.txt")) {
            Get-ChildItem $output -Recurse -Include FAILED.txt,errors.log,bindings.log | ForEach-Object {
              $detail = (Get-Content $_.FullName -Raw).Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error::$detail"
            }
            throw "UI smoke failed: exit $($p.ExitCode)"
          }
          Get-Content "$output/ui-smoke.txt"
      - name: Existing regression suite
        shell: pwsh
        run: |
          $exe = Resolve-Path 'bin/portable/SentinelX.exe'
          $output = Join-Path $PWD 'test-results/regression'
          $p = Start-Process $exe -ArgumentList '--self-test', $output -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'Regression timeout' }
          if ($p.ExitCode -ne 0) {
            Get-ChildItem $output -Recurse -Include FAILED.txt,errors.log | ForEach-Object {
              $detail = (Get-Content $_.FullName -Raw).Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error::$detail"
            }
            throw "Regression failed: exit $($p.ExitCode)"
          }
          Get-ChildItem $output
      - name: Build per-user EXE installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler missing from Windows runner image' }
          [xml]$project = Get-Content SENTINEL-X.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          & $compiler "/DAppVersion=$version" 'installer/SentinelX.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Assemble release assets
        shell: pwsh
        run: |
          [xml]$project = Get-Content SENTINEL-X.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $commit = (git rev-parse --short HEAD)
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path 'bin/portable/*' -DestinationPath "dist/SentinelX-$version-win-x64-portable.zip" -Force
          $installer = Get-ChildItem 'bin/installer/*.exe' | Select-Object -First 1
          Copy-Item $installer.FullName "dist/SentinelX-$version-win-x64-setup.exe"
          @(
            "SENTINEL X $version",
            "commit: $commit",
            "runtime: .NET 10 Desktop (wbudowany w paczce)",
            "platforma: Windows 10/11 x64",
            "podpis: BRAK — pliki nie są podpisane cyfrowo, SmartScreen pokaże ostrzeżenie",
            "dane: wszystko zostaje lokalnie w %LocalAppData%\SentinelX (rozmowy, wspomnienia, raporty, archiwa)",
            "AI: wbudowany silnik (llama.cpp) — modele Qwen3 pobierają się same, bez Ollamy i bez chmury",
            "telefon: aplikacja na Androida (SentinelX-Phone-$version.apk) albo przeglądarka; zgoda to jedno kliknięcie na komputerze",
            "portable: rozpakuj ZIP i uruchom SentinelX.exe (bez instalacji)",
            "instalator: instalacja per-user, bez uprawnień administratora"
          ) | Set-Content 'dist/BUILD.txt' -Encoding utf8
          Get-ChildItem 'dist' -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content 'dist/SHA256SUMS.txt'
          Get-Content 'dist/SHA256SUMS.txt'
          Get-Content 'dist/SHA256SUMS.txt' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        with:
          name: sentinelx-release-windows-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # limit magazynu artefaktów nie może zamieniać wyników testów na czerwone
        if: always()
        with:
          name: sentinel-release-validation
          path: test-results/
          retention-days: 2

  android:
    needs: signing-check
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SENTINELX_ANDROID_KEYSTORE_BASE64: ${{ secrets.SENTINELX_ANDROID_KEYSTORE_BASE64 }}
      SENTINELX_ANDROID_STORE_PASSWORD: ${{ secrets.SENTINELX_ANDROID_STORE_PASSWORD }}
      SENTINELX_ANDROID_KEY_ALIAS: ${{ secrets.SENTINELX_ANDROID_KEY_ALIAS }}
      SENTINELX_ANDROID_KEY_PASSWORD: ${{ secrets.SENTINELX_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/build-apk
        with:
          require-stable-signing: 'true'
      - name: Package validated APK and checksum for the publisher
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' SENTINEL-X.csproj | head -n 1)
          mkdir -p dist
          apk="SentinelX-Phone-$version.apk"
          cp "${{ steps.build.outputs.apk }}" "dist/$apk"
          (cd dist && sha256sum "$apk" > "$apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: sentinelx-release-phone-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [windows, android]
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: sentinelx-release-windows-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sentinelx-release-phone-${{ github.sha }}
          path: dist
      - name: Validate complete assets, then create a new release without clobbering existing releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' SENTINEL-X.csproj | head -n 1)
          expected_tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${INPUT_TAG:-$expected_tag}"
          fi
          if [[ "$tag" != "$expected_tag" || ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Nieprawidłowa wersja wydania::Tag '$tag' musi odpowiadać wersji $expected_tag w SENTINEL-X.csproj."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != 'tag' ]] && git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            echo "::error title=Tag już istnieje::Nie tworzę wydania z istniejącego tagu. Uruchom workflow z poprawnego tagu albo zwiększ wersję."
            exit 1
          fi
          apk="SentinelX-Phone-$version.apk"
          installer="SentinelX-$version-win-x64-setup.exe"
          portable="SentinelX-$version-win-x64-portable.zip"
          for file in "$apk" "$installer" "$portable" BUILD.txt SHA256SUMS.txt; do
            if [[ ! -f "dist/$file" ]]; then
              echo "::error title=Brak zasobu wydania::Brakuje dist/$file; publikacja została wstrzymana."
              exit 1
            fi
          done
          (cd dist && sha256sum --check SHA256SUMS.txt)
          (cd dist && sha256sum --check "$apk.sha256")
          (cd dist && sha256sum "$apk" >> SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error title=Wydanie już istnieje::$tag nie zostanie nadpisane. Użyj nowej wersji/tagu."
            exit 1
          fi
          notes_file="docs/RELEASE-${version%.*}.md"
          if [[ -f "$notes_file" ]]; then
            release_notes=$(cat "$notes_file")
          else
            release_notes="Sentinel X $version. Pełna lista plików i sum kontrolnych znajduje się w załącznikach wydania."
          fi
          notes=$(cat <<EOF
          $release_notes

          Wydanie powstało dopiero po zielonych testach kompilacji, UI i regresji na Windows oraz poprawnym podpisaniu APK kluczem z chronionych sekretów.
          EOF
          )
          prerelease_args=()
          if [[ "$GITHUB_REF_TYPE" != 'tag' && "${INPUT_PRERELEASE:-true}" != 'false' ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "SentinelX $version" --notes "$notes" "${prerelease_args[@]}"
          mapfile -t files < <(find dist -maxdepth 1 -type f | sort)
          gh release upload "$tag" "${files[@]}"
          echo "::notice title=Wydanie opublikowane::$tag · ${#files[@]} plików"
          printf '%s\n' "$tag" "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
