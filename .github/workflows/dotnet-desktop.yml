name: Build Windows app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -File -Filter *.sln | Select-Object -First 1

          if ($solution) {
            $target = $solution.FullName
          } else {
            $projects = @(Get-ChildItem -Path . -File -Filter *.csproj)

            if ($projects.Count -ne 1) {
              throw "Nie znaleziono jednej solucji .sln ani jednego projektu .csproj w głównym katalogu repozytorium."
            }

            $target = $projects[0].FullName
          }

          dotnet restore $target
          dotnet build $target --configuration Release --no-restore

  winui:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build WinUI shell
        shell: pwsh
        run: |
          dotnet restore SentinelX.WinUI/SentinelX.WinUI.csproj
          dotnet build SentinelX.WinUI/SentinelX.WinUI.csproj --configuration Release --no-restore --nologo -v minimal 2>&1 | Tee-Object -FilePath build-winui.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface compiler errors as check annotations (readable via API when raw logs are not).
            $ws = ($env:GITHUB_WORKSPACE -replace '\\', '/') + '/'
            $errors = Select-String -Path build-winui.log -Pattern '^(.+?)\((\d+)(?:,(\d+))?\):\s+error\s+([A-Z]+\d+):\s*(.*)$'
            foreach ($m in $errors) {
              $g = $m.Matches[0].Groups
              $file = ($g[1].Value -replace '\\', '/') -replace [regex]::Escape($ws), ''
              $msg = (($g[4].Value + ' ' + $g[5].Value) -replace '::', ';').Trim()
              if ($g[3].Value) { Write-Output "::error file=$file,line=$($g[2].Value),col=$($g[3].Value)::$msg" }
              else { Write-Output "::error file=$file,line=$($g[2].Value)::$msg" }
            }
            $msb = Select-String -Path build-winui.log -Pattern 'error\s+(MSB\d+):\s*(.*)$' | Select-Object -First 5
            foreach ($m in $msb) { Write-Output ('::error title=MSBuild failure::' + (($m.Line -replace '::', ';').Trim())) }
          }
          exit $code

      - name: WinUI smoke test (headless)
        shell: pwsh
        run: |
          $exe = 'SentinelX.WinUI/bin/Release/net8.0-windows10.0.22621.0/win-x64/SentinelX.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem -Path SentinelX.WinUI/bin/Release -Recurse -Filter SentinelX.exe | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $exe) { throw 'Nie znaleziono zbudowanego SentinelX.exe (WinUI).' }
          $output = Join-Path $PWD 'test-results/winui'
          $p = Start-Process $exe -ArgumentList '--ui-smoke', $output -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw 'Test WinUI przekroczył czas.' }
          if (Test-Path (Join-Path $output 'SMOKE.txt')) { Get-Content (Join-Path $output 'SMOKE.txt') }
          if ($p.ExitCode -ne 0) { throw "Test WinUI nie przeszedł (kod $($p.ExitCode)); szczegóły: $output" }
          Write-Output 'Test WinUI: OK'
