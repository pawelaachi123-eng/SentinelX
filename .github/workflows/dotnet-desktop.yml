name: Build Windows app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -File -Filter *.sln | Select-Object -First 1

          if ($solution) {
            $target = $solution.FullName
          } else {
            $projects = @(Get-ChildItem -Path . -File -Filter *.csproj)

            if ($projects.Count -ne 1) {
              throw "Nie znaleziono jednej solucji .sln ani jednego projektu .csproj w głównym katalogu repozytorium."
            }

            $target = $projects[0].FullName
          }

          dotnet restore $target
          dotnet build $target --configuration Release --no-restore

  winui:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build WinUI shell
        shell: pwsh
        run: |
          # NOTE: Emit-Errors must be invoked as a bare statement (never in an expression),
          # otherwise its Write-Output is captured and the runner never sees the ::error lines.
          $ws = ($env:GITHUB_WORKSPACE -replace '\\', '/') + '/'
          $script:errCount = 0
          function Emit-Errors([string]$log) {
            $withLoc = @(Select-String -Path $log -Pattern '^(.+?)\((\d+)(?:,(\d+))?\):\s*error\s*(?:([A-Z]+\d+):)?\s*(.*)$')
            foreach ($m in $withLoc) {
              $g = $m.Matches[0].Groups
              $file = ($g[1].Value -replace '\\', '/') -replace [regex]::Escape($ws), ''
              $msg = ((($g[4].Value + ' ' + $g[5].Value) -replace '::', ';').Trim())
              if ($g[3].Value) { Write-Output "::error file=$file,line=$($g[2].Value),col=$($g[3].Value)::$msg" }
              else { Write-Output "::error file=$file,line=$($g[2].Value)::$msg" }
              $script:errCount++
            }
            $bare = @((Select-String -Path $log -Pattern ':\s*error\s*:|:\s*error\s+[A-Z]+\d+:' | Where-Object { $_.Line -notmatch '\(\d+,\d*\):\s*error' } | Select-Object -First 10))
            foreach ($m in $bare) {
              Write-Output ('::error title=Restore/build failure::' + (($m.Line -replace '::', ';').Trim()))
              $script:errCount++
            }
          }
          dotnet restore SentinelX.WinUI/SentinelX.WinUI.csproj --nologo -v minimal 2>&1 | Tee-Object -FilePath restore-winui.log
          $rc = $LASTEXITCODE
          dotnet build SentinelX.WinUI/SentinelX.WinUI.csproj --configuration Release -p:Platform=x64 --nologo -v normal 2>&1 | Tee-Object -FilePath build-winui.log
          $bc = $LASTEXITCODE
          if ($rc -ne 0) { Emit-Errors 'restore-winui.log' }
          if ($bc -ne 0) { Emit-Errors 'build-winui.log' }
          if ($bc -ne 0) {
            # XamlCompiler inner diagnostics (it often fails without an MSBuild error code).
            $inner = @(Select-String -Path build-winui.log -Pattern 'WMC\d+|XamlCompiler|Markup\.Compiler.*(error|fail|exception)|GENERATE.*FAIL' | Select-Object -First 15)
            foreach ($m in $inner) {
              Write-Output ('::error title=XAML compiler output::' + (($m.Line -replace '::', ';').Trim()))
            }
            $outJson = Get-ChildItem -Path SentinelX.WinUI/obj -Recurse -Filter output.json -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($outJson) {
              $txt = (Get-Content $outJson.FullName -Raw)
              if ($txt.Length -gt 3000) { $txt = $txt.Substring(0, 3000) + '…[truncated]' }
              Write-Output ('::error title=XAML output.json::' + (($txt -replace '::', ';' -replace "`r`n", '%0A' -replace "`n", '%0A')))
            }
            # Context: 8 lines before/after each XamlCompiler mention.
            $lines = Get-Content build-winui.log
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'XamlCompiler\.exe') {
                $a = [Math]::Max(0, $i - 8); $b = [Math]::Min($lines.Count - 1, $i + 8)
                $ctx = (($lines[$a..$b] -join '%0A') -replace '::', ';')
                Write-Output "::error title=XAML context @$i::$ctx"
              }
            }
            # Input file: does input.json exist and what does it feed the compiler?
            $inJson = Get-ChildItem -Path SentinelX.WinUI/obj -Recurse -Filter input.json -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($inJson) {
              $itxt = (Get-Content $inJson.FullName -Raw)
              if ($itxt.Length -gt 2500) { $itxt = $itxt.Substring(0, 2500) + '…[truncated]' }
              Write-Output ('::error title=XAML input.json::' + (($itxt -replace '::', ';' -replace "`r`n", '%0A' -replace "`n", '%0A')))
              # Decisive test: run XamlCompiler manually and capture its own stdout/stderr.
              $xc = Join-Path $env:USERPROFILE '.nuget/packages/microsoft.windowsappsdk/1.5.240627000/tools/net472/XamlCompiler.exe'
              $manual = (& $xc $inJson.FullName (Join-Path $env:TEMP 'xc-manual-out.json') 2>&1 | Out-String)
              $xccode = $LASTEXITCODE
              if ($manual.Length -gt 2500) { $manual = $manual.Substring(0, 2500) + '…[truncated]' }
              if (-not $manual.Trim()) { $manual = '(no output at all)' }
              Write-Output ('::error title=XAML manual run exit ' + $xccode + '::' + (($manual -replace '::', ';' -replace "`r`n", '%0A' -replace "`n", '%0A')))
            } else {
              Write-Output '::error title=XAML input.json::(missing — targets did not generate input)'
            }
            # Raw tail, always (cheap insurance against parser blind spots).
            $tail = ((Get-Content build-winui.log -Tail 40) -join '%0A' -replace '::', ';')
            Write-Output "::error title=WinUI build failed (exit $bc), raw tail::$tail"
          }
          if ($rc -ne 0) { exit $rc } else { exit $bc }

      - name: WinUI smoke test (headless)
        shell: pwsh
        run: |
          $exe = 'SentinelX.WinUI/bin/Release/net8.0-windows10.0.22621.0/win-x64/SentinelX.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem -Path SentinelX.WinUI/bin/Release -Recurse -Filter SentinelX.exe | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $exe) { throw 'Nie znaleziono zbudowanego SentinelX.exe (WinUI).' }
          $output = Join-Path $PWD 'test-results/winui'
          $p = Start-Process $exe -ArgumentList '--ui-smoke', $output -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw 'Test WinUI przekroczył czas.' }
          if (Test-Path (Join-Path $output 'SMOKE.txt')) { Get-Content (Join-Path $output 'SMOKE.txt') }
          if ($p.ExitCode -ne 0) { throw "Test WinUI nie przeszedł (kod $($p.ExitCode)); szczegóły: $output" }
          Write-Output 'Test WinUI: OK'
