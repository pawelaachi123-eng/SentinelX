name: Build Windows app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -File -Filter *.sln | Select-Object -First 1

          if ($solution) {
            $target = $solution.FullName
          } else {
            $projects = @(Get-ChildItem -Path . -File -Filter *.csproj)

            if ($projects.Count -ne 1) {
              throw "Nie znaleziono jednej solucji .sln ani jednego projektu .csproj w głównym katalogu repozytorium."
            }

            $target = $projects[0].FullName
          }

          dotnet restore $target
          dotnet build $target --configuration Release --no-restore

  winui:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build WinUI shell
        shell: pwsh
        run: |
          # NOTE: Emit-Errors must be invoked as a bare statement (never in an expression),
          # otherwise its Write-Output is captured and the runner never sees the ::error lines.
          $ws = ($env:GITHUB_WORKSPACE -replace '\\', '/') + '/'
          $script:errCount = 0
          function Emit-Errors([string]$log) {
            $withLoc = @(Select-String -Path $log -Pattern '^(.+?)\((\d+)(?:,(\d+))?\):\s*error\s*(?:([A-Z]+\d+):)?\s*(.*)$')
            foreach ($m in $withLoc) {
              $g = $m.Matches[0].Groups
              $file = ($g[1].Value -replace '\\', '/') -replace [regex]::Escape($ws), ''
              $msg = ((($g[4].Value + ' ' + $g[5].Value) -replace '::', ';').Trim())
              if ($g[3].Value) { Write-Output "::error file=$file,line=$($g[2].Value),col=$($g[3].Value)::$msg" }
              else { Write-Output "::error file=$file,line=$($g[2].Value)::$msg" }
              $script:errCount++
            }
            $bare = @((Select-String -Path $log -Pattern ':\s*error\s*:|:\s*error\s+[A-Z]+\d+:' | Where-Object { $_.Line -notmatch '\(\d+,\d*\):\s*error' } | Select-Object -First 10))
            foreach ($m in $bare) {
              Write-Output ('::error title=Restore/build failure::' + (($m.Line -replace '::', ';').Trim()))
              $script:errCount++
            }
          }
          dotnet restore SentinelX.WinUI/SentinelX.WinUI.csproj --nologo -v minimal 2>&1 | Tee-Object -FilePath restore-winui.log
          $rc = $LASTEXITCODE
          dotnet build SentinelX.WinUI/SentinelX.WinUI.csproj --configuration Release -p:Platform=x64 --nologo -v minimal 2>&1 | Tee-Object -FilePath build-winui.log
          $bc = $LASTEXITCODE
          if ($rc -ne 0) { Emit-Errors 'restore-winui.log' }
          if ($bc -ne 0) { Emit-Errors 'build-winui.log' }
          if ($bc -ne 0) {
            # NOTE: GitHub keeps ~10 error annotations per step — pack everything into ONE bundle.
            $B = @()
            $sdkRoot = Join-Path $env:USERPROFILE '.nuget/packages/microsoft.windowsappsdk/1.5.240627000/tools'
            $xc = Join-Path $sdkRoot 'net472/XamlCompiler.exe'
            if (Test-Path $xc) { $v = [Diagnostics.FileVersionInfo]::GetVersionInfo($xc); $B += "exe: v$($v.FileVersion), $((Get-Item $xc).Length) bytes" } else { $B += 'exe: MISSING' }
            $noargs = (& $xc 2>&1 | Out-String); $nc = $LASTEXITCODE
            if ($noargs.Length -gt 800) { $noargs = $noargs.Substring(0, 800) }
            if (-not $noargs.Trim()) { $noargs = '(silent)' }
            $B += "no-args: exit=$nc out=[$($noargs.Trim())]"
            $inJson = Get-ChildItem -Path SentinelX.WinUI/obj -Recurse -Filter input.json -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($inJson) {
              $itxt = (Get-Content $inJson.FullName -Raw)
              $B += "input: len=$($itxt.Length) cwd=$PWD"
              try {
                $ij = (Get-Content $inJson.FullName -Raw) | ConvertFrom-Json -Depth 20
                $B += ('input-keys: ' + (($ij.PSObject.Properties.Name) -join ','))
                $pg = $ij.Pages; if ($null -eq $pg) { $pg = $ij.Page }; if ($null -eq $pg) { $pg = $ij.MarkupFiles }; if ($null -eq $pg) { $pg = $ij.Files }; if ($null -eq $pg) { $pg = $ij.XamlFiles }
                if ($null -eq $pg) { $B += 'page-array: (key not found)' }
                elseif ($pg -is [array]) { $B += "page-array: count=$($pg.Count)" }
                else { $B += 'page-array: single-object' }
                if ($null -ne $pg) {
                  $first = ($pg | Select-Object -First 1 | ConvertTo-Json -Compress -Depth 6)
                  if ($first.Length -gt 900) { $first = $first.Substring(0, 900) }
                  $B += "page-first: $first"
                }
              } catch { $B += ('JSONPROBE-FAIL: ' + $_.Exception.Message) }
              # Timed manual runs: from repo root vs from project dir (relative paths in input!).
              try {
                $tRoot = (Measure-Command { $m1 = (& $xc $inJson.FullName (Join-Path $env:TEMP 'xc-r1.json') 2>&1 | Out-String); $script:c1 = $LASTEXITCODE }).TotalSeconds
                if ($m1.Length -gt 300) { $m1 = $m1.Substring(0, 300) }
                if (-not $m1.Trim()) { $m1 = '(silent)' }
                $B += "manual-root: exit=$script:c1 time=$([Math]::Round($tRoot,1))s out=[$($m1.Trim())] outfile=$((Test-Path (Join-Path $env:TEMP 'xc-r1.json')))"
              } catch { $B += ('ROOTPROBE-FAIL: ' + $_.Exception.Message) }
              try {
                Push-Location SentinelX.WinUI
                try {
                  $tProj = (Measure-Command { $m2 = (& $xc $inJson.FullName (Join-Path $env:TEMP 'xc-r2.json') 2>&1 | Out-String); $script:c2 = $LASTEXITCODE }).TotalSeconds
                } finally { Pop-Location }
                if ($m2.Length -gt 300) { $m2 = $m2.Substring(0, 300) }
                if (-not $m2.Trim()) { $m2 = '(silent)' }
                $r2 = Test-Path (Join-Path $env:TEMP 'xc-r2.json')
                $B += "manual-projdir: exit=$script:c2 time=$([Math]::Round($tProj,1))s out=[$($m2.Trim())] outfile=$r2"
                if ($r2) {
                  $mo = (Get-Content (Join-Path $env:TEMP 'xc-r2.json') -Raw)
                  if ($mo.Length -gt 1500) { $mo = $mo.Substring(0, 1500) + '…[trunc]' }
                  $B += "projdir-out-file: $mo"
                }
              } catch { $B += ('PROJDIRPROBE-FAIL: ' + $_.Exception.Message) }
              $ix = Get-ChildItem -Path SentinelX.WinUI/obj -Recurse -Directory -Filter intermediatexaml -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($ix) { $ixn = ((Get-ChildItem $ix.FullName -File | ForEach-Object { $_.Name }) -join ', '); if (-not $ixn) { $ixn = '(empty)' }; $B += "intermediatexaml: $ixn" }
            } else { $B += 'input: MISSING' }
            $wmc = @(Select-String -Path build-winui.log -Pattern 'WMC\d+' | Select-Object -First 5)
            foreach ($w in $wmc) { $B += "WMC: $($w.Line.Trim())" }
            $B += '--- tail ---'
            foreach ($t in (Get-Content build-winui.log -Tail 12)) { $B += $t }
            $clean = { param($s) ((($s -replace "`r`n", ' ') -replace "`n", ' ') -replace '\s+', ' ').Trim() }
            $bundle = (((($B | ForEach-Object { & $clean $_ }) -join '%0A') -replace '::', ';'))
            Write-Output "::error title=XAML diagnosis::$bundle"
          }
          if ($rc -ne 0) { exit $rc } else { exit $bc }

      - name: WinUI smoke test (headless)
        shell: pwsh
        run: |
          $exe = 'SentinelX.WinUI/bin/Release/net8.0-windows10.0.22621.0/win-x64/SentinelX.exe'
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem -Path SentinelX.WinUI/bin/Release -Recurse -Filter SentinelX.exe | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $exe) { throw 'Nie znaleziono zbudowanego SentinelX.exe (WinUI).' }
          $output = Join-Path $PWD 'test-results/winui'
          $p = Start-Process $exe -ArgumentList '--ui-smoke', $output -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw 'Test WinUI przekroczył czas.' }
          if (Test-Path (Join-Path $output 'SMOKE.txt')) { Get-Content (Join-Path $output 'SMOKE.txt') }
          if ($p.ExitCode -ne 0) { throw "Test WinUI nie przeszedł (kod $($p.ExitCode)); szczegóły: $output" }
          Write-Output 'Test WinUI: OK'
