name: Build Sentinel X phone APK
description: >
  Builds and signs phone-android (Gradle, no third-party libraries) and returns the APK path.
  Runs on ubuntu-latest (Android SDK and licences are preinstalled there; Linux minutes cost half of Windows ones).
outputs:
  apk:
    description: Path of the signed APK
    value: ${{ steps.find.outputs.apk }}
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
        cache-disabled: true
    - name: Check the signing key (a new one is created only if this one cannot be read)
      shell: bash
      run: |
        ks=phone-android/app/sentinelx-phone.p12
        if ! keytool -list -keystore "$ks" -storetype PKCS12 -storepass sentinelx -alias sentinelx >/dev/null 2>&1; then
          echo "::warning title=Klucz podpisu APK::Nie mogę odczytać klucza — tworzę nowy. Telefon trzeba wtedy raz odinstalować przed aktualizacją."
          rm -f "$ks"
          keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass sentinelx -keypass sentinelx -alias sentinelx \
            -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=SentinelX Phone, O=SentinelX"
        fi
    - name: Build and sign the APK
      shell: bash
      working-directory: phone-android
      run: |
        if ! gradle --no-daemon --console=plain assembleRelease > ../gradle.log 2>&1; then
          tail -n 100 ../gradle.log
          msg=$(tail -n 60 ../gradle.log | python3 -c 'import sys; t = sys.stdin.read(); print(t.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))')
          echo "::error title=Budowanie APK (Gradle) nie powiodło się::$msg"
          exit 1
        fi
        tail -n 8 ../gradle.log
    - name: Locate the APK
      id: find
      shell: bash
      run: |
        apk=$(ls phone-android/app/build/outputs/apk/release/*.apk | head -n 1)
        test -f "$apk" || { echo "::error::Gradle nie wyprodukował pliku APK"; exit 1; }
        echo "apk=$apk" >> "$GITHUB_OUTPUT"
        echo "APK: $apk ($(du -h "$apk" | cut -f1))"
