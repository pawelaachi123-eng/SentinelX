name: Build Sentinel X verification APK
description: Lint, unit tests and debug signed APK; no private signing key in the repository.
outputs:
  apk:
    description: Verification/debug APK
    value: phone-android/app/build/outputs/apk/debug/app-debug.apk
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/wrapper-validation@v4
    - uses: gradle/actions/setup-gradle@v4
    - shell: bash
      working-directory: phone-android
      run: |
        set -euo pipefail
        chmod +x gradlew
        ./gradlew --no-daemon --console=plain lintDebug testDebugUnitTest assembleDebug
